<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .links {
            margin-top: 20px;
            text-align: center;
        }

        .links a {
            display: inline-block;
            padding: 10px 20px;
            margin: 5px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .links a:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Add New Student</h1>

    <form method="POST">

        <label>Name</label>
        <input type="text" name="name" required>

        <label>Father Name</label>
        <input type="text" name="father_name" required>

        <label>Roll No</label>
        <input type="text" name="roll_no" required>

        <label>Course</label>
        <input type="text" name="course" required>

        <label>Year</label>
        <select name="year" required>
            <option value="">Select Year</option>
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="3rd Year">3rd Year</option>
            <option value="4th Year">4th Year</option>
        </select>

        <label>Semester</label>
        <select name="semester" required>
            <option value="">Select Semester</option>
            <option value="1st Sem">1st Sem</option>
            <option value="2nd Sem">2nd Sem</option>
            <option value="3rd Sem">3rd Sem</option>
            <option value="4th Sem">4th Sem</option>
            <option value="5th Sem">5th Sem</option>
            <option value="6th Sem">6th Sem</option>
            <option value="7th Sem">7th Sem</option>
            <option value="8th Sem">8th Sem</option>
        </select>

        <label>Email</label>
        <input type="email" name="email">

        <label>Phone</label>
        <input type="text" name="phone">

        <label>City</label>
        <input type="text" name="city">

        <label>Course Fee</label>
        <input type="number" step="0.01" name="course_fee">

        <label>Last Fee Date</label>
        <input type="date" name="last_fee_date">

        <label>Fee Paid Date</label>
        <input type="date" name="fee_paid_date">

        <label>Fee Paid</label>
        <input type="number" step="0.01" name="fee_paid">

        <button type="submit">Add Student</button>

    </form>

    <div class="links">
        <a href="/students">View Students</a>
        <a href="/">Back Home</a>
    </div>

</div>

</body>
</html>
