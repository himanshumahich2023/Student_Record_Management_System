<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1f4e78;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input[readonly] {
            background-color: #f5f5f5;
        }

        button {
            background-color: #1f4e78;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        button:hover {
            background-color: #163a5c;
        }

        .links {
            margin-top: 20px;
            text-align: center;
        }

        .links a {
            text-decoration: none;
            color: #1f4e78;
            margin: 0 10px;
        }

        .fee-section {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
        }

        .fee-section h2 {
            color: #1f4e78;
            margin-top: 0;
        }

        @media (min-width: 700px) {
            .form-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Add Student</h1>

    <form method="POST" action="/add">

        <div class="form-row">

            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" required>
            </div>

            <div class="form-group">
                <label>Father Name</label>
                <input type="text" name="father_name">
            </div>

        </div>


        <div class="form-row">

            <div class="form-group">
                <label>Roll No</label>
                <input type="text" name="roll_no">
            </div>

            <div class="form-group">
                <label>Course</label>
                <input type="text" name="course">
            </div>

        </div>


        <div class="form-row">

            <div class="form-group">
                <label>Year</label>

                <select name="year">
                    <option value="">Select Year</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                </select>
            </div>

            <div class="form-group">
                <label>Semester</label>

                <select name="semester">
                    <option value="">Select Semester</option>
                    <option value="1st Sem">1st Sem</option>
                    <option value="2nd Sem">2nd Sem</option>
                    <option value="3rd Sem">3rd Sem</option>
                    <option value="4th Sem">4th Sem</option>
                    <option value="5th Sem">5th Sem</option>
                    <option value="6th Sem">6th Sem</option>
                    <option value="7th Sem">7th Sem</option>
                    <option value="8th Sem">8th Sem</option>
                </select>
            </div>

        </div>


        <div class="form-row">

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email">
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone">
            </div>

        </div>


        <div class="form-group">
            <label>City</label>
            <input type="text" name="city">
        </div>


        <!-- FEE DETAILS -->

        <div class="fee-section">

            <h2>Fee Details</h2>

            <div class="form-row">

                <div class="form-group">
                    <label>Course Fee</label>
                    <input
                        type="number"
                        name="course_fee"
                        min="0"
                        step="0.01"
                        value="0"
                    >
                </div>

                <div class="form-group">
                    <label>Last Fee Date</label>
                    <input
                        type="date"
                        name="last_fee_date"
                    >
                </div>

            </div>


            <div class="form-row">

                <div class="form-group">
                    <label>Fee Paid Date</label>
                    <input
                        type="date"
                        name="fee_paid_date"
                    >
                </div>

                <div class="form-group">
                    <label>Fee Paid</label>
                    <input
                        type="number"
                        name="fee_paid"
                        min="0"
                        step="0.01"
                        value="0"
                    >
                </div>

            </div>


            <div class="form-row">

                <div class="form-group">
                    <label>Late Days</label>
                    <input
                        type="text"
                        id="late_days_display"
                        readonly
                        value="0"
                    >
                </div>

                <div class="form-group">
                    <label>Fine Per Day</label>
                    <input
                        type="text"
                        id="fine_per_day_display"
                        readonly
                        value="₹50"
                    >
                </div>

            </div>


            <div class="form-row">

                <div class="form-group">
                    <label>Total Fine</label>
                    <input
                        type="text"
                        id="total_fine_display"
                        readonly
                        value="₹0.00"
                    >
                </div>

                <div class="form-group">
                    <label>Total Payable</label>
                    <input
                        type="text"
                        id="total_payable_display"
                        readonly
                        value="₹0.00"
                    >
                </div>

            </div>


            <div class="form-group">
                <label>Remaining Fee</label>
                <input
                    type="text"
                    id="remaining_fee_display"
                    readonly
                    value="₹0.00"
                >
            </div>

        </div>


        <button type="submit">
            Add Student
        </button>

    </form>


    <div class="links">

        <a href="/students">
            Back to Students
        </a>

        |

        <a href="/">
            Back Home
        </a>

    </div>

</div>


<script>

function calculateFee() {

    const courseFee =
        parseFloat(
            document.querySelector('[name="course_fee"]').value
        ) || 0;

    const lastFeeDate =
        document.querySelector('[name="last_fee_date"]').value;

    const feePaidDate =
        document.querySelector('[name="fee_paid_date"]').value;

    const feePaid =
        parseFloat(
            document.querySelector('[name="fee_paid"]').value
        ) || 0;

    const finePerDay = 50;

    let lateDays = 0;

    if (lastFeeDate && feePaidDate) {

        const lastDate =
            new Date(lastFeeDate + "T00:00:00");

        const paidDate =
            new Date(feePaidDate + "T00:00:00");

        const difference =
            paidDate - lastDate;

        lateDays = Math.max(
            Math.floor(
                difference / (1000 * 60 * 60 * 24)
            ),
            0
        );
    }

    const totalFine =
        lateDays * finePerDay;

    const totalPayable =
        courseFee + totalFine;

    const remainingFee =
        Math.max(
            totalPayable - feePaid,
            0
        );


    document.getElementById(
        "late_days_display"
    ).value = lateDays;


    document.getElementById(
        "fine_per_day_display"
    ).value = "₹" + finePerDay;


    document.getElementById(
        "total_fine_display"
    ).value =
        "₹" + totalFine.toFixed(2);


    document.getElementById(
        "total_payable_display"
    ).value =
        "₹" + totalPayable.toFixed(2);


    document.getElementById(
        "remaining_fee_display"
    ).value =
        "₹" + remainingFee.toFixed(2);
}


document.querySelector(
    '[name="course_fee"]'
).addEventListener(
    "input",
    calculateFee
);


document.querySelector(
    '[name="last_fee_date"]'
).addEventListener(
    "change",
    calculateFee
);


document.querySelector(
    '[name="fee_paid_date"]'
).addEventListener(
    "change",
    calculateFee
);


document.querySelector(
    '[name="fee_paid"]'
).addEventListener(
    "input",
    calculateFee
);


calculateFee();

</script>

</body>
</html>
