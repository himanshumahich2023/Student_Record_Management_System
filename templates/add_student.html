<!DOCTYPE html>
<html>
<head>
    <title>Add New Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .calculated {
            background-color: #f5f5f5;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            margin: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Add New Student</h1>

    <form method="POST">

        <label>Name</label>
        <input type="text" name="name" required>

        <label>Father Name</label>
        <input type="text" name="father_name" required>

        <label>Roll No</label>
        <input type="text" name="roll_no" required>

        <label>Course</label>
        <input type="text" name="course" required>

        <label>Email</label>
        <input type="email" name="email">

        <label>Phone</label>
        <input type="text" name="phone">

        <label>City</label>
        <input type="text" name="city">

        <label>Course Fee</label>
        <input
            type="number"
            id="course_fee"
            name="course_fee"
            min="0"
            step="0.01"
            value="0"
            oninput="calculateFee()"
            required
        >

        <label>Last Fee Date</label>
        <input
            type="date"
            id="last_fee_date"
            name="last_fee_date"
            onchange="calculateFee()"
            required
        >

        <label>Fee Paid Date</label>
        <input
            type="date"
            id="fee_paid_date"
            name="fee_paid_date"
            onchange="calculateFee()"
            required
        >

        <label>Late Days</label>
        <input
            type="number"
            id="late_days"
            value="0"
            class="calculated"
            readonly
        >

        <label>Fine Per Day</label>
        <input
            type="number"
            id="fine_per_day"
            value="50"
            class="calculated"
            readonly
        >

        <label>Total Fine</label>
        <input
            type="number"
            id="total_fine"
            value="0"
            class="calculated"
            readonly
        >

        <label>Total Payable</label>
        <input
            type="number"
            id="total_payable"
            value="0"
            class="calculated"
            readonly
        >

        <label>Fee Paid</label>
        <input
            type="number"
            id="fee_paid"
            name="fee_paid"
            min="0"
            step="0.01"
            value="0"
            oninput="calculateFee()"
            required
        >

        <label>Remaining Fee</label>
        <input
            type="number"
            id="remaining_fee"
            value="0"
            class="calculated"
            readonly
        >

        <button type="submit">
            Add Student
        </button>

    </form>

    <div class="links">
        <a href="/students">View Students</a>
        <a href="/">Back Home</a>
    </div>

</div>


<script>

function calculateFee() {

    let courseFee = parseFloat(
        document.getElementById("course_fee").value
    ) || 0;

    let lastDate = document.getElementById(
        "last_fee_date"
    ).value;

    let paidDate = document.getElementById(
        "fee_paid_date"
    ).value;

    let feePaid = parseFloat(
        document.getElementById("fee_paid").value
    ) || 0;


    // =========================
    // CALCULATE LATE DAYS
    // =========================

    let lateDays = 0;

    if (lastDate && paidDate) {

        let due = new Date(lastDate);
        let paid = new Date(paidDate);

        let difference =
            (paid - due) / (1000 * 60 * 60 * 24);

        if (difference > 0) {
            lateDays = difference;
        }
    }


    // =========================
    // FINE PER DAY
    // =========================

    let finePerDay = 50;


    // =========================
    // TOTAL FINE
    // =========================

    let totalFine =
        lateDays * finePerDay;


    // =========================
    // TOTAL PAYABLE
    // =========================

    let totalPayable =
        courseFee + totalFine;


    // =========================
    // REMAINING FEE
    // =========================

    let remainingFee =
        totalPayable - feePaid;

    if (remainingFee < 0) {
        remainingFee = 0;
    }


    // =========================
    // SHOW VALUES
    // =========================

    document.getElementById(
        "late_days"
    ).value = lateDays;

    document.getElementById(
        "fine_per_day"
    ).value = finePerDay;

    document.getElementById(
        "total_fine"
    ).value = totalFine;

    document.getElementById(
        "total_payable"
    ).value = totalPayable;

    document.getElementById(
        "remaining_fee"
    ).value = remainingFee;
}

</script>

</body>
</html>
