<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        .container {
            width: 70%;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Edit Student</h1>

    <form method="POST">

        <label>Student ID</label>
        <input
            type="number"
            name="id"
            value="{{ student.id }}"
            min="1"
            required
        >

        <label>Name</label>
        <input
            type="text"
            name="name"
            value="{{ student.name }}"
            required
        >

        <label>Father Name</label>
        <input
            type="text"
            name="father_name"
            value="{{ student.father_name }}"
            required
        >

        <label>Roll No</label>
        <input
            type="text"
            name="roll_no"
            value="{{ student.roll_no }}"
            required
        >

        <label>Course</label>
        <input
            type="text"
            name="course"
            value="{{ student.course }}"
            required
        >

        <label>Email</label>
        <input
            type="email"
            name="email"
            value="{{ student.email }}"
        >

        <label>Phone</label>
        <input
            type="text"
            name="phone"
            value="{{ student.phone }}"
        >

        <label>City</label>
        <input
            type="text"
            name="city"
            value="{{ student.city }}"
        >

        <label>Course Fee</label>
        <input
            type="number"
            step="0.01"
            name="course_fee"
            value="{{ student.course_fee }}"
        >

        <label>Last Fee Date</label>
        <input
            type="date"
            name="last_fee_date"
            value="{{ student.last_fee_date }}"
        >

        <label>Fee Paid Date</label>
        <input
            type="date"
            name="fee_paid_date"
            value="{{ student.fee_paid_date }}"
        >

        <label>Fee Paid</label>
        <input
            type="number"
            step="0.01"
            name="fee_paid"
            value="{{ student.fee_paid }}"
        >

        <button type="submit">
            Update Student
        </button>

    </form>

    <a class="back" href="/students">
        Back to Students
    </a>

</div>

</body>
</html>
