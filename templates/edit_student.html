<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            display: inline-block;
            padding: 10px 20px;
            margin: 5px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Edit Student</h1>

    <form method="POST">

        <label>ID</label>
        <input type="number"
               name="id"
               value="{{ student.id }}"
               required>

        <label>Name</label>
        <input type="text"
               name="name"
               value="{{ student.name or '' }}"
               required>

        <label>Father Name</label>
        <input type="text"
               name="father_name"
               value="{{ student.father_name or '' }}"
               required>

        <label>Roll No</label>
        <input type="text"
               name="roll_no"
               value="{{ student.roll_no or '' }}"
               required>

        <label>Course</label>
        <input type="text"
               name="course"
               value="{{ student.course or '' }}"
               required>

        <label>Year</label>
        <select name="year" required>

            <option value="">Select Year</option>

            <option value="1st Year"
                {% if student.year == "1st Year" %}selected{% endif %}>
                1st Year
            </option>

            <option value="2nd Year"
                {% if student.year == "2nd Year" %}selected{% endif %}>
                2nd Year
            </option>

            <option value="3rd Year"
                {% if student.year == "3rd Year" %}selected{% endif %}>
                3rd Year
            </option>

            <option value="4th Year"
                {% if student.year == "4th Year" %}selected{% endif %}>
                4th Year
            </option>

        </select>

        <label>Semester</label>
        <select name="semester" required>

            <option value="">Select Semester</option>

            <option value="1st Sem"
                {% if student.semester == "1st Sem" %}selected{% endif %}>
                1st Sem
            </option>

            <option value="2nd Sem"
                {% if student.semester == "2nd Sem" %}selected{% endif %}>
                2nd Sem
            </option>

            <option value="3rd Sem"
                {% if student.semester == "3rd Sem" %}selected{% endif %}>
                3rd Sem
            </option>

            <option value="4th Sem"
                {% if student.semester == "4th Sem" %}selected{% endif %}>
                4th Sem
            </option>

            <option value="5th Sem"
                {% if student.semester == "5th Sem" %}selected{% endif %}>
                5th Sem
            </option>

            <option value="6th Sem"
                {% if student.semester == "6th Sem" %}selected{% endif %}>
                6th Sem
            </option>

            <option value="7th Sem"
                {% if student.semester == "7th Sem" %}selected{% endif %}>
                7th Sem
            </option>

            <option value="8th Sem"
                {% if student.semester == "8th Sem" %}selected{% endif %}>
                8th Sem
            </option>

        </select>

        <label>Email</label>
        <input type="email"
               name="email"
               value="{{ student.email or '' }}">

        <label>Phone</label>
        <input type="text"
               name="phone"
               value="{{ student.phone or '' }}">

        <label>City</label>
        <input type="text"
               name="city"
               value="{{ student.city or '' }}">

        <label>Course Fee</label>
        <input type="number"
               name="course_fee"
               step="0.01"
               min="0"
               value="{{ student.course_fee or 0 }}">

        <label>Last Fee Date</label>
        <input type="date"
               name="last_fee_date"
               value="{{ student.last_fee_date or '' }}">

        <label>Fee Paid Date</label>
        <input type="date"
               name="fee_paid_date"
               value="{{ student.fee_paid_date or '' }}">

        <label>Fee Paid</label>
        <input type="number"
               name="fee_paid"
               step="0.01"
               min="0"
               value="{{ student.fee_paid or 0 }}">

        <button type="submit">
            Update Student
        </button>

    </form>

    <div class="links">
        <a href="/students">Back to Students</a>
        <a href="/">Back Home</a>
    </div>

</div>

</body>
</html>
